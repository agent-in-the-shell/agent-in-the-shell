<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'PatrickHand';src:url('fonts/PatrickHand-Regular.ttf') format('truetype');font-display:block;}
@font-face{font-family:'ZKuaiLe';src:url('fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');font-display:block;}

:root{
  --cream:#fbf9f1;
  --ink:#2b2b28;
  --green:#1f8a43;
  --green-d:#146b32;
  --green-fill:#e9f5ec;
  --green-line:#2f9a52;
  --red:#e5432a;
  --gray:#5c5b55;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1080px;}
body{
  background:var(--cream);
  font-family:'ZKuaiLe','PatrickHand',sans-serif;
  color:var(--ink);position:relative;overflow:hidden;
}
.page{position:absolute;inset:0;padding:46px 58px 44px;display:flex;flex-direction:column;}
.page::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(0,0,0,.045) 1.3px,transparent 1.3px);
  background-size:26px 26px;opacity:.5;pointer-events:none;
}
.idx{position:absolute;top:30px;right:44px;font-family:'PatrickHand';font-size:34px;color:var(--gray);}

.title-wrap{text-align:center;position:relative;z-index:2;white-space:nowrap;}
.spark{color:var(--green);font-family:'PatrickHand';font-size:40px;vertical-align:middle;margin:0 16px;opacity:.8;}
.title{font-family:'PatrickHand','ZKuaiLe';font-size:57px;line-height:1.0;color:var(--green-d);display:inline-block;vertical-align:middle;}
.title .cjk{font-family:'ZKuaiLe';}
.uline{display:block;margin:2px auto 0;width:610px;height:16px;}
.subtitle{font-family:'PatrickHand';font-size:37px;color:var(--ink);margin-top:8px;letter-spacing:.5px;}

.hookwrap{text-align:center;margin-top:14px;}
.hook{font-family:'ZKuaiLe','PatrickHand';font-size:36px;color:var(--red);display:inline-block;}
.hook .s{font-family:'PatrickHand';margin:0 14px;font-size:32px;}

.cards{margin-top:18px;display:flex;flex-direction:column;gap:18px;}
.card{position:relative;padding:22px 32px;display:flex;align-items:center;gap:28px;min-height:150px;}
.card::before{
  content:"";position:absolute;inset:0;
  background:var(--green-fill);border:3px solid var(--green-line);border-radius:30px;
  box-shadow:3px 4px 0 rgba(31,138,67,.16);
  filter:url(#rough);
}
.card:nth-child(1){transform:rotate(-.5deg);}
.card:nth-child(2){transform:rotate(.4deg);}
.card:nth-child(3){transform:rotate(-.35deg);}
.card>.ic,.card>.ct{position:relative;z-index:1;}
.ic{flex:0 0 92px;height:92px;}
.ct h3{font-family:'ZKuaiLe';font-size:42px;color:var(--green-d);line-height:1.1;margin-bottom:5px;}
.ct p{font-family:'ZKuaiLe',sans-serif;font-size:27px;line-height:1.34;color:var(--gray);}
.ct p b{color:var(--ink);}

.bottom{margin-top:auto;padding-top:16px;text-align:center;}
.take{font-family:'ZKuaiLe','PatrickHand';font-size:40px;color:var(--red);}
.take .s{font-family:'PatrickHand';margin:0 14px;font-size:32px;}
.tline{display:block;margin:4px auto 0;width:580px;height:14px;}
.footer{font-family:'PatrickHand';font-size:25px;color:#a3a196;letter-spacing:.5px;margin-top:14px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="page">
  <div class="idx">1 / 1</div>

  <div class="title-wrap">
    <span class="spark">&#8805;</span>
    <span class="title"><span class="cjk">一顆 binary，接上所有 LLM</span></span>
    <span class="spark">&#8804;</span>
    <svg class="uline" viewBox="0 0 610 16" fill="none"><path d="M8 9 C120 3,230 14,340 7 S560 5,602 10" stroke="#2f9a52" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="subtitle">One binary. Every LLM provider.</div>
  </div>

  <div class="hookwrap"><span class="hook"><span class="s">&#10022;</span>你的 app 照打 OpenAI，背後隨時換供應商<span class="s">&#10022;</span></span></div>

  <div class="cards">
    <div class="card">
      <svg class="ic" viewBox="0 0 100 100" fill="none" stroke="#146b32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="50" r="9"/><path d="M29 50 H54"/>
        <path d="M54 50 C66 50,66 26,80 26"/><path d="M54 50 C66 50,66 74,80 74"/>
        <path d="M72 18 L82 26 L72 34" stroke="#e5432a"/><path d="M72 66 L82 74 L72 82" stroke="#e5432a"/>
      </svg>
      <div class="ct"><h3>多供應商路由</h3><p>OpenAI · Anthropic · Gemini · DeepSeek…<br><b>一個 endpoint 全接</b></p></div>
    </div>
    <div class="card">
      <svg class="ic" viewBox="0 0 100 100" fill="none" stroke="#146b32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="12"/>
        <path d="M50 20 V38 M50 62 V80 M20 50 H38 M62 50 H80"/>
        <path d="M74 30 A32 32 0 0 1 78 58" stroke="#e5432a" stroke-width="6"/><path d="M72 22 L80 30 L71 35" stroke="#e5432a" stroke-width="5"/>
      </svg>
      <div class="ct"><h3>自動 fallback</h3><p>這家掛了 / 429，<b>自動切備援</b>，<br>你的 app 一行都不用改</p></div>
    </div>
    <div class="card">
      <svg class="ic" viewBox="0 0 100 100" fill="none" stroke="#146b32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 84 H84"/><rect x="24" y="54" width="14" height="26"/><rect x="46" y="40" width="14" height="40"/>
        <rect x="68" y="26" width="14" height="54" stroke="#e5432a"/>
        <text x="69" y="20" font-family="PatrickHand" font-size="26" fill="#e5432a" stroke="none">$</text>
      </svg>
      <div class="ct"><h3>成本追蹤</h3><p>每次呼叫的 <b>token、花費、延遲</b><br>全部記帳，看得一清二楚</p></div>
    </div>
  </div>

  <div class="bottom">
    <div class="take"><span class="s">&#8805;</span>換模型 = 改一行 YAML，不是改程式<span class="s">&#8804;</span></div>
    <svg class="tline" viewBox="0 0 580 14" fill="none"><path d="M6 8 C120 3,250 12,370 6 S540 5,574 9" stroke="#e5432a" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="footer">agent-in-the-shell · agent-model</div>
  </div>
</div>
</body>
</html>
