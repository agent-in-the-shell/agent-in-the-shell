# Release configuration for agent-model and agent-shell.
version: 2

project_name: agent-in-the-shell

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-model
    main: ./cmd/agent-model
    binary: agent-model
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: agent-shell
    main: ./cmd/agent-shell
    binary: agent-shell
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: agent-model-archive
    ids: ["agent-model"]
    name_template: "agent-model_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # SKILL.md ships with the binary: it is the agent-facing contract (install,
    # env vars, on-disk files, usage) required by docs/ops/release-checklist.md.
    files: [LICENSE, README.md, skills/agentmodel/SKILL.md]
  - id: agent-shell-archive
    ids: ["agent-shell"]
    name_template: "agent-shell_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md, skills/agentshell/SKILL.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: agent-model-image
    ids: ["agent-model"]
    images: ["ghcr.io/agent-in-the-shell/agent-model"]
    tags:
      - "{{ .Version }}"
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.distroless
    platforms: [linux/amd64, linux/arm64]
    build_args:
      BINARY: agent-model
    labels:
      org.opencontainers.image.title: agent-model
      org.opencontainers.image.source: https://github.com/agent-in-the-shell/agent-in-the-shell
  # Deliberately no agent-shell image. This Dockerfile's premise is that "the
  # 'one binary' value literally is the image", and that does not hold for
  # agent-shell: its job is exec'ing claude/codex/gemini/agy/cursor-agent, none
  # of which exist in a distroless base (no shell, no node, no npm). An image
  # where submit, run, install and doctor all fail by construction is a second
  # artifact to keep patched in exchange for a `--help` printer — the opposite
  # of 最小攻擊面. Archives, go install and Homebrew all ship it.

brews:
  - name: agent-model
    ids: ["agent-model-archive"]
    repository:
      owner: agent-in-the-shell
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: https://github.com/agent-in-the-shell/agent-in-the-shell
    description: "OpenAI-compatible LLM gateway — multi-provider routing, fallback, cost tracking"
    license: MIT
    install: |
      bin.install "agent-model"
    test: |
      system "#{bin}/agent-model", "--help"
  - name: agent-shell
    ids: ["agent-shell-archive"]
    repository:
      owner: agent-in-the-shell
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: https://github.com/agent-in-the-shell/agent-in-the-shell
    description: "One CLI over the local coding-agent CLIs — ordered fallback, normalized results, usage-limit probes"
    license: MIT
    install: |
      bin.install "agent-shell"
    test: |
      system "#{bin}/agent-shell", "--help"
