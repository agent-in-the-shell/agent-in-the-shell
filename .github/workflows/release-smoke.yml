name: release smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify, for example v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  archives:
    name: archives (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: macos-15-intel
            platform: darwin/amd64
          - runner: macos-15
            platform: darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/release-smoke.sh archives --tag "${{ inputs.tag }}" --platform "${{ matrix.platform }}"

  go-install:
    name: go install (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: macos-15-intel
            platform: darwin/amd64
          - runner: macos-15
            platform: darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash .github/scripts/release-smoke.sh go-install --tag "${{ inputs.tag }}" --platform "${{ matrix.platform }}"

  homebrew:
    name: homebrew (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin/amd64
          - runner: macos-15
            platform: darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/release-smoke.sh homebrew --tag "${{ inputs.tag }}" --platform "${{ matrix.platform }}"

  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: bash .github/scripts/release-smoke.sh docker --tag "${{ inputs.tag }}" --platform "${{ matrix.platform }}"
