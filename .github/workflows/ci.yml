# Shared checks for pull requests, main, and release candidates.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Tags run these checks through release.yml before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A dated image, not ubuntu-latest: `latest` rolls to a new major without a
    # commit here, so a green build stops meaning "this tree builds on the
    # image we tested".
    runs-on: ubuntu-24.04
    steps:
      # Pinned to full commit SHAs — see the note in release.yml. setup-go is
      # held at the same version release.yml uses; the two had drifted (v5 here,
      # v6 there), so CI was not testing the release toolchain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go test -race ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Portal UI tests
        run: node --test services/agentmodel/api/portal_ui_test.mjs
      - name: staticcheck
        run: |
          # Pinned for the same reason as govulncheck below: this installs and
          # then runs a binary. Unlike govulncheck there is no live database
          # behind it, so the pin fixes the findings too — a new release can
          # add checks, and that must land as a deliberate version bump rather
          # than turning someone's unrelated PR red.
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          # Pinned to a released version: this installs and then runs a binary,
          # so a floating ref here is a remote-code-execution surface on every
          # CI run. The vulnerability DATABASE is still fetched live, so
          # pinning the tool does not pin what it knows about.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
