name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default. The write scopes live on the one job that needs them,
# so a job added later starts with no credentials instead of inheriting the
# release token by accident.
permissions:
  contents: read

jobs:
  ci:
    # The local reusable workflow and checkout use this release's commit.
    # No release secrets or write permissions are passed to the checks.
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload archives
      packages: write # push images to ghcr.io
    steps:
      # Third-party actions are pinned to a full commit SHA, never a tag. A
      # major tag is a mutable ref: anyone who can move it runs arbitrary code
      # in this job, which holds contents:write, packages:write and the
      # Homebrew tap PAT. The trailing comment keeps the version readable and
      # is what Dependabot rewrites when it bumps the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # The goreleaser BINARY, a separate download from the action above.
          # This was previously unpinned — a tool fetched at run time into a job
          # holding write credentials. Bump deliberately.
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  smoke:
    needs: goreleaser
    # Stated explicitly: a called workflow's token is capped by the caller, so
    # relying on the workflow-scope default would silently starve it of
    # packages:read now that the default is read-only.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
